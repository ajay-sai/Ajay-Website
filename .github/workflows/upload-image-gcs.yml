name: Upload Image to GCS

on:
  push:
    paths:
      - 'public/images/profile/Ajay-for-website-main.jpeg'
    branches:
      - main
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Upload image to GCS
        run: |
          gsutil -h "Cache-Control:public,max-age=31536000,immutable" \
            cp public/images/profile/Ajay-for-website-main.jpeg \
            gs://ajay-portfolio-assets/images/profile/Ajay-for-website-main.jpeg
          
          echo "Image uploaded successfully!"
          echo "URL: https://storage.googleapis.com/ajay-portfolio-assets/images/profile/Ajay-for-website-main.jpeg"
